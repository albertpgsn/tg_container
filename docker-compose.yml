name: telegram-crm

services:
  db:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: telegram_crm
      POSTGRES_USER: telegram_crm
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - listen_addresses=*
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telegram_crm -d telegram_crm"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb

  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env.docker}
      TELEGRAM_API_HASH_FILE: /run/secrets/telegram_api_hash
      SESSION_ENCRYPTION_KEY_FILE: /run/secrets/session_encryption_key
      DATABASE_URL_FILE: /run/secrets/database_url
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      ADMIN_BOOTSTRAP_PASSWORD_HASH_FILE: /run/secrets/admin_password_hash
      COOKIE_SECURE: "false"
      ADMIN_SESSION_HOURS: "12"
      MEDIA_CACHE_DIR: /tmp/media-cache
      MEDIA_CACHE_MAX_BYTES: "209715200"
    secrets:
      - telegram_api_hash
      - session_encryption_key
      - database_url
      - admin_password_hash
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - frontend
      - database
      - egress
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,noexec,nosuid,nodev
      - /var/run:size=8m,noexec,nosuid,nodev
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  frontend:
    internal: true
  database:
    internal: true
  egress:

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  telegram_api_hash:
    file: ./secrets/telegram_api_hash
  session_encryption_key:
    file: ./secrets/session_encryption_key
  database_url:
    file: ./secrets/database_url
  admin_password_hash:
    file: ./secrets/admin_password_hash
